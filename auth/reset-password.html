<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset-password.css">
</head>
<body>
  <main class="wrap">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m22 7-10 6L2 7"/>
      </svg>
    </div>

    <h1>Reset password</h1>
    <p class="subtitle">We'll send you a link to reset it</p>

    <div class="card">
      <form id="reset-form" novalidate>
        <label for="email">Email address</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <button type="submit" id="submit-btn">Send reset link</button>
        <p class="message" id="message" role="status"></p>
      </form>

      <a href="login.html" class="back">&larr; Back to log in</a>
    </div>
  </main>

  <script src="js/reset-password.js"></script>
</body>
</html>
